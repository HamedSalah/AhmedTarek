<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>موقع أحمد طارق</title>
    <style>
      /* إعدادات الخلفية والحركة البصرية */
      body {
        margin: 0;
        padding: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
        background-size: 400% 400%;
        animation: gradientBg 15s ease infinite;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
      }

      @keyframes gradientBg {
        0% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 100% 50%;
        }
        100% {
          background-position: 0% 50%;
        }
      }

      /* كارت العرض بمؤثرات زجاجية Glassmorphism */
      .card {
        background: rgba(255, 255, 255, 0.15);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 20px;
        padding: 40px;
        text-align: center;
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        color: #fff;
        max-width: 400px;
        width: 90%;
        transform: translateY(50px);
        opacity: 0;
        animation: fadeInUp 1s cubic-bezier(0.1, 1, 0.1, 1) forwards;
      }

      @keyframes fadeInUp {
        to {
          transform: translateY(0);
          opacity: 1;
        }
      }

      /* المؤثرات البصرية للنصوص */
      h1 {
        margin: 0 0 10px 0;
        font-size: 2.5rem;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
      }

      p {
        font-size: 1.2rem;
        color: #f0f0f0;
        margin-bottom: 30px;
      }

      /* صندوق الحساب الرقمي */
      .account-box {
        background: rgba(0, 0, 0, 0.2);
        padding: 15px;
        border-radius: 12px;
        font-size: 1.5rem;
        font-weight: bold;
        letter-spacing: 1px;
        border: 1px dashed rgba(255, 255, 255, 0.4);
        transition: all 0.3s ease;
        cursor: pointer;
      }

      /* تأثير عند تمرير الماوس فوق الحساب */
      .account-box:hover {
        background: rgba(255, 255, 255, 0.9);
        color: #333;
        transform: scale(1.05);
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
      }

      .footer {
        margin-top: 25px;
        font-size: 0.9rem;
        opacity: 0.7;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>أهلاً بك</h1>
      <p>الموقع الرسمي الخاص بـ أحمد طارق</p>

      <!-- عرض الحساب المطلوب -->
      <div class="account-box">أحمد طارق 2850</div>

      <div class="footer">جميع الحقوق محفوظة © 2026</div>
    </div>
  </body>
</html>
